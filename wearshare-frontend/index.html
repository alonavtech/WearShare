<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4a7c0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>WearShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alyamama:wght@400;500;700;800;900&family=Caveat:wght@600;700&family=Titan+One&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device" id="device">
    <div class="screen" id="screen">
      <div class="devbar" id="devbar"><label id="viewerWrap" hidden>Demo · viewing as <select id="viewerSel" aria-label="Switch demo user"></select></label></div>
      <main id="main"></main>
    </div>
    <nav class="nav" id="nav" aria-label="Main" hidden></nav>
    <div id="modalRoot"></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="wearshare.js"></script>
  <script src="live.js"></script>
</body>
</html>
